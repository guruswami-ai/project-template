name: Task
description: A unit of work for a human or an agent
labels: ["task"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this is done?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Files, docs, decisions or prior issues the worker needs.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance checks
      description: How a reviewer will confirm it is done (tests, commands, observable behaviour).
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Suitable for an agent?
      options:
        - "Yes"
        - "No, needs a human"
        - Not sure
