# Dependabot version updates. Security updates are enabled account-wide.
# Uncomment the ecosystems this project uses.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
