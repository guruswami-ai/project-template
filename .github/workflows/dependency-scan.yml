name: Dependency scan

# Fails a pull request that introduces a dependency with a known vulnerability (OSV database).
# SARIF upload is off so this also works on private repos without paid code scanning.

on:
  pull_request:
  merge_group:

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  osv-scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      upload-sarif: false
      fail-on-vuln: true
